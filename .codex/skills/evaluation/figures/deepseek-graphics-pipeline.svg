<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowEval" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#0F172A}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#0F172A}
      .body{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .mono{font:400 13px Consolas,monospace;fill:#7C2D12}
      .label{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#0F172A}
      .legend{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1600" height="760" fill="#FFFFFF"/>
  <text x="70" y="62" class="title">How a text-only model participates in editable figure generation</text>
  <text x="70" y="94" class="subtitle">DeepSeek plans and writes structured graphics; local tools render the pixels and reconstruct editable deliverables.</text>

  <!-- Step labels -->
  <g>
    <circle cx="113" cy="145" r="17" fill="#334155"/><text x="113" y="151" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="140" y="151" class="label">Scientific input</text>
    <circle cx="393" cy="145" r="17" fill="#334155"/><text x="393" y="151" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="420" y="151" class="label">Visual specification</text>
    <circle cx="684" cy="145" r="17" fill="#D97757"/><text x="684" y="151" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="711" y="151" class="label">Text/code generation</text>
    <circle cx="1004" cy="145" r="17" fill="#64748B"/><text x="1004" y="151" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="1031" y="151" class="label">Local rendering</text>
    <circle cx="1300" cy="145" r="17" fill="#009E73"/><text x="1300" y="151" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
    <text x="1327" y="151" class="label">Editable outputs</text>
  </g>

  <!-- Main cards -->
  <g>
    <rect x="65" y="178" width="230" height="285" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="335" y="178" width="255" height="285" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="630" y="178" width="285" height="285" rx="18" fill="#FFF7F3" stroke="#D97757" stroke-width="2"/>
    <rect x="955" y="178" width="265" height="285" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <rect x="1260" y="178" width="275" height="285" rx="18" fill="#F2FBF7" stroke="#009E73" stroke-width="2"/>
  </g>

  <!-- Input card -->
  <g>
    <text x="90" y="215" class="head">Paper or prompt</text>
    <rect x="90" y="239" width="180" height="78" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <line x1="108" y1="258" x2="249" y2="258" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="108" y1="277" x2="231" y2="277" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    <line x1="108" y1="296" x2="242" y2="296" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    <text x="90" y="350" class="body">Method topology</text>
    <text x="90" y="375" class="body">Exact labels and data</text>
    <text x="90" y="400" class="body">Format constraints</text>
    <text x="90" y="435" class="small">No result is invented.</text>
  </g>

  <!-- Specification card -->
  <g>
    <text x="360" y="215" class="head">CCFA visual contract</text>
    <rect x="360" y="238" width="205" height="174" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="384" cy="267" r="6" fill="#56B4E9"/><text x="402" y="273" class="body">Nodes and stages</text>
    <circle cx="384" cy="301" r="6" fill="#56B4E9"/><text x="402" y="307" class="body">Typed connections</text>
    <circle cx="384" cy="335" r="6" fill="#56B4E9"/><text x="402" y="341" class="body">Layout blueprint</text>
    <circle cx="384" cy="369" r="6" fill="#56B4E9"/><text x="402" y="375" class="body">Palette and legend</text>
    <text x="360" y="439" class="small">Structured text artifact</text>
  </g>

  <!-- Model card -->
  <g>
    <text x="655" y="215" class="head">DeepSeek-V4-Flash</text>
    <rect x="655" y="237" width="235" height="146" rx="10" fill="#FFFFFF" stroke="#F0B39F" stroke-dasharray="7 5"/>
    <text x="672" y="264" class="mono">&lt;svg viewBox="..."&gt;</text>
    <text x="672" y="289" class="mono">  &lt;rect ... /&gt;</text>
    <text x="672" y="314" class="mono">  &lt;text&gt;Stage 1&lt;/text&gt;</text>
    <text x="672" y="339" class="mono">  &lt;path ... /&gt;</text>
    <text x="672" y="364" class="mono">&lt;/svg&gt;</text>
    <text x="655" y="408" class="body" font-weight="600">Produces text and code</text>
    <text x="655" y="433" class="small">It does not emit pixels.</text>
  </g>

  <!-- Local renderer card -->
  <g>
    <text x="980" y="215" class="head">Deterministic tools</text>
    <rect x="980" y="238" width="215" height="174" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="1004" y="264" width="68" height="43" rx="7" fill="#E0F2FE" stroke="#56B4E9"/>
    <rect x="1102" y="264" width="68" height="43" rx="7" fill="#F3E8FF" stroke="#9B72CF"/>
    <line x1="1073" y1="285" x2="1094" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1053" y="338" width="68" height="43" rx="7" fill="#FDECEC" stroke="#D55E00"/>
    <line x1="1087" y1="309" x2="1087" y2="329" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1017" y="291" class="small">SVG</text>
    <text x="1115" y="291" class="small">Render</text>
    <text x="1064" y="365" class="small">PPTX</text>
    <text x="980" y="439" class="small">Rendering and reconstruction</text>
  </g>

  <!-- Outputs card -->
  <g>
    <text x="1285" y="215" class="head">Publication assets</text>
    <rect x="1285" y="241" width="105" height="76" rx="10" fill="#FFFFFF" stroke="#009E73"/>
    <rect x="1405" y="241" width="105" height="76" rx="10" fill="#FFFFFF" stroke="#009E73"/>
    <rect x="1285" y="333" width="105" height="76" rx="10" fill="#FFFFFF" stroke="#009E73"/>
    <rect x="1405" y="333" width="105" height="76" rx="10" fill="#FFFFFF" stroke="#009E73"/>
    <text x="1337" y="273" text-anchor="middle" class="head" fill="#007A5A">SVG</text>
    <text x="1337" y="296" text-anchor="middle" class="small">live text</text>
    <text x="1457" y="273" text-anchor="middle" class="head" fill="#007A5A">PPTX</text>
    <text x="1457" y="296" text-anchor="middle" class="small">native objects</text>
    <text x="1337" y="365" text-anchor="middle" class="head" fill="#007A5A">PDF</text>
    <text x="1337" y="388" text-anchor="middle" class="small">vector export</text>
    <text x="1457" y="365" text-anchor="middle" class="head" fill="#007A5A">PNG</text>
    <text x="1457" y="388" text-anchor="middle" class="small">preview</text>
    <text x="1285" y="439" class="small">Selectable or rendered files</text>
  </g>

  <!-- Handoff arrows -->
  <line x1="296" y1="321" x2="327" y2="321" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="591" y1="321" x2="622" y2="321" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="916" y1="321" x2="947" y2="321" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1221" y1="321" x2="1252" y2="321" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Evaluation lane -->
  <rect x="335" y="510" width="885" height="88" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="365" y="543" class="head">Evaluation lane</text>
  <text x="365" y="570" class="body">Rendered previews are scored on six visual criteria.</text>
  <rect x="1026" y="528" width="166" height="48" rx="12" fill="#FFFFFF" stroke="#64748B"/>
  <text x="1109" y="558" text-anchor="middle" class="label">GPT-5.6-Terra judge</text>
  <path d="M1398 464 L1398 488 Q1398 510 1376 510 L1228 510" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowEval)"/>

  <!-- Legend -->
  <rect x="65" y="632" width="1470" height="77" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="90" y="663" class="label">Legend</text>
  <rect x="170" y="648" width="24" height="18" rx="4" fill="#FFF7F3" stroke="#D97757" stroke-width="2"/><text x="205" y="662" class="legend">DeepSeek text/code backend</text>
  <rect x="420" y="648" width="24" height="18" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="455" y="662" class="legend">Shared local tool</text>
  <rect x="610" y="648" width="24" height="18" rx="4" fill="#F2FBF7" stroke="#009E73" stroke-width="2"/><text x="645" y="662" class="legend">Editable or rendered output</text>
  <rect x="887" y="648" width="24" height="18" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4"/><text x="922" y="662" class="legend">Text/structured artifact</text>
  <line x1="1122" y1="657" x2="1168" y2="657" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="1180" y="662" class="legend">Artifact handoff</text>
  <line x1="1325" y1="657" x2="1371" y2="657" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowEval)"/><text x="1383" y="662" class="legend">Evaluation only</text>
  <text x="170" y="690" class="small">“DeepSeek + CCFA” names the full planning, code-generation, rendering, and reconstruction pipeline; it does not claim native pixel generation by DeepSeek.</text>
</svg>
