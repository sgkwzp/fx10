<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DynTrace architecture for 4D spatio-temporal reasoning</title>
  <desc id="desc">A three-stage left-to-right method diagram showing dynamic object extraction, spatio-temporal dynamics encoding with DTV and DTG branches, and MLLM-based representation integration and reasoning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#53627a"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#4a7fd4"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#24334b" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #1d2b45; letter-spacing: .1px; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #5b6980; }
      .stage-title { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .stage-sub { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #506078; letter-spacing: .5px; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #24334b; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #4d5d73; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; fill: #53627a; }
      .micro { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #59687e; }
      .card { fill: #ffffff; stroke: #d6dfed; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #53627a; stroke-width: 2.3; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #98a8be; stroke-width: 1.6; stroke-dasharray: 5 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="800" y="54" text-anchor="middle" class="title">DynTrace: Tracking Dynamic Object Evidence for 4D Spatio-Temporal Reasoning</text>
  <text x="800" y="81" text-anchor="middle" class="subtitle">Training-free framework with geometry-informed visual priors and structured dynamic traces</text>

