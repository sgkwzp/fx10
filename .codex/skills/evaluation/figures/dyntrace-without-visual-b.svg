  <rect x="510" y="112" width="605" height="725" rx="18" fill="#fbfaff" stroke="#d5c8f3" stroke-width="1.5"/>
  <rect x="1137" y="112" width="435" height="725" rx="18" fill="#fffafb" stroke="#f0c6cc" stroke-width="1.5"/>

  <rect x="47" y="130" width="422" height="42" rx="11" fill="#4f8edb"/>
  <text x="258" y="157" text-anchor="middle" class="stage-title">Stage 1: Dynamic Objects Extraction</text>
  <text x="258" y="193" text-anchor="middle" class="stage-sub">QUERY-RELEVANT, INDEPENDENTLY MOVING INSTANCES</text>

  <rect x="529" y="130" width="567" height="42" rx="11" fill="#8063c7"/>
  <text x="812" y="157" text-anchor="middle" class="stage-title">Stage 2: Spatio-Temporal Dynamics Encoding</text>
  <text x="812" y="193" text-anchor="middle" class="stage-sub">GEOMETRY-GROUNDED DYNAMIC EVIDENCE</text>

