<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#0F172A}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .panel{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#0F172A}
      .body{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .tiny{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#64748B}
      .value{font:700 23px 'Segoe UI',Arial,sans-serif;fill:#0F172A}
      .axis{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .legend{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#FFFFFF"/>
  <text x="62" y="57" class="title">FigureBench results: quality, preference, efficiency, and editability</text>
  <text x="62" y="89" class="subtitle">Balanced 20-task subset: 5 Blog, 5 Paper, 5 Survey, and 5 Textbook tasks</text>

  <!-- Shared legend -->
  <rect x="62" y="112" width="1476" height="64" rx="13" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="87" y="133" width="27" height="19" rx="4" fill="#D97757"/><text x="126" y="148" class="legend">DeepSeek-V4-Flash + CCFA</text>
  <rect x="366" y="133" width="27" height="19" rx="4" fill="#3373B9"/><text x="405" y="148" class="legend">GPT-5.5 + CCFA</text>
  <line x1="616" y1="143" x2="660" y2="143" stroke="#0F172A" stroke-width="3"/><circle cx="638" cy="143" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/><text x="674" y="148" class="legend">Point = mean; whisker = 95% bootstrap CI</text>
  <rect x="1057" y="133" width="27" height="19" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="1096" y="148" class="legend">100% editable delivery</text>
  <text x="1315" y="148" class="small">Lower is better: time, tokens, cost</text>

  <!-- Panel A -->
  <rect x="62" y="199" width="725" height="329" rx="16" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1.5"/>
  <text x="88" y="233" class="panel">(a) Reproduced rubric quality</text>
  <text x="88" y="258" class="small">Mean score on a 1–10 scale</text>
  <!-- axis -->
  <line x1="224" y1="454" x2="738" y2="454" stroke="#94A3B8" stroke-width="1.5"/>
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="224" y1="286" x2="224" y2="454"/><line x1="327" y1="286" x2="327" y2="454"/>
    <line x1="430" y1="286" x2="430" y2="454"/><line x1="533" y1="286" x2="533" y2="454"/>
    <line x1="636" y1="286" x2="636" y2="454"/><line x1="738" y1="286" x2="738" y2="454"/>
  </g>
  <g class="axis" text-anchor="middle"><text x="224" y="478">5</text><text x="327" y="478">6</text><text x="430" y="478">7</text><text x="533" y="478">8</text><text x="636" y="478">9</text><text x="738" y="478">10</text></g>
  <text x="88" y="328" class="body">DeepSeek + CCFA</text>
  <text x="88" y="401" class="body">GPT + CCFA</text>
  <!-- DeepSeek CI 7.3625 to 7.99375, mean 7.678125 on 5..10 -->
  <line x1="467" y1="321" x2="532" y2="321" stroke="#D97757" stroke-width="5" stroke-linecap="round"/>
  <line x1="467" y1="310" x2="467" y2="332" stroke="#D97757" stroke-width="3"/><line x1="532" y1="310" x2="532" y2="332" stroke="#D97757" stroke-width="3"/>
  <circle cx="499" cy="321" r="10" fill="#D97757" stroke="#FFFFFF" stroke-width="3"/>
  <text x="552" y="328" class="value" fill="#B95235">7.678</text>
  <text x="646" y="327" class="small">[7.363, 7.994]</text>
  <!-- GPT CI -->
  <line x1="266" y1="394" x2="449" y2="394" stroke="#3373B9" stroke-width="5" stroke-linecap="round"/>
  <line x1="266" y1="383" x2="266" y2="405" stroke="#3373B9" stroke-width="3"/><line x1="449" y1="383" x2="449" y2="405" stroke="#3373B9" stroke-width="3"/>
  <circle cx="365" cy="394" r="10" fill="#3373B9" stroke="#FFFFFF" stroke-width="3"/>
  <text x="466" y="401" class="value" fill="#245C95">6.367</text>
  <text x="560" y="400" class="small">[5.407, 7.190]</text>
  <text x="88" y="506" class="small">Paired mean difference: +1.311 [0.436, 2.321]</text>

  <!-- Panel B -->
  <rect x="813" y="199" width="725" height="329" rx="16" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1.5"/>
  <text x="839" y="233" class="panel">(b) Pairwise outcomes</text>
  <text x="839" y="258" class="small">DeepSeek + CCFA compared with GPT + CCFA on the same 20 tasks</text>
  <rect x="858" y="304" width="480" height="62" rx="10" fill="#D97757"/>
  <path d="M1218 304 H1282 V366 H1218 Z" fill="#A6A6A6"/>
  <path d="M1282 304 H1338 Q1348 304 1348 314 V356 Q1348 366 1338 366 H1282 Z" fill="#3373B9"/>
  <text x="1038" y="343" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#FFFFFF">15 wins</text>
  <text x="1250" y="343" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#FFFFFF">2 ties</text>
  <text x="1315" y="343" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#FFFFFF">3 losses</text>
  <text x="858" y="407" class="value">75%</text><text x="918" y="406" class="body">of tasks favored DeepSeek + CCFA</text>
  <text x="858" y="442" class="body">Exact sign test: p = 0.0075</text>
  <text x="858" y="477" class="small">Judge preference rates reported separately: 55% DeepSeek, 35% GPT, 10% tie.</text>
  <text x="858" y="506" class="small">“Win” means a higher paired rubric score, not a claim of universal superiority.</text>

  <!-- Panel C -->
  <rect x="62" y="552" width="956" height="365" rx="16" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1.5"/>
  <text x="88" y="586" class="panel">(c) Resource profile</text>
  <text x="88" y="611" class="small">Independent scales are used for seconds and total tokens; cost cards use their stated accounting basis.</text>

  <!-- Row labels -->
  <text x="88" y="667" class="body">Mean time</text><text x="88" y="692" class="tiny">seconds/task</text>
  <text x="88" y="765" class="body">Consumed tokens</text><text x="88" y="790" class="tiny">recorded input + output over 20 tasks</text>
  <text x="88" y="862" class="body">Current cost</text><text x="88" y="887" class="tiny">USD; not directly additive</text>

  <!-- time bars scale max 220 -->
  <rect x="239" y="645" width="608" height="20" rx="5" fill="#F1F5F9"/><rect x="239" y="645" width="548" height="20" rx="5" fill="#D97757"/><text x="800" y="662" class="body">198.3 s</text>
  <rect x="239" y="675" width="608" height="20" rx="5" fill="#F1F5F9"/><rect x="239" y="675" width="277" height="20" rx="5" fill="#3373B9"/><text x="529" y="692" class="body">100.3 s</text>
  <!-- token bars scale max 1m -->
  <rect x="239" y="743" width="608" height="20" rx="5" fill="#F1F5F9"/><rect x="239" y="743" width="566" height="20" rx="5" fill="#D97757"/><text x="818" y="760" class="body">931,639</text>
  <rect x="239" y="773" width="608" height="20" rx="5" fill="#F1F5F9"/><rect x="239" y="773" width="270" height="20" rx="5" fill="#3373B9"/><text x="522" y="790" class="body">443,501</text>
  <!-- cost cards: distinct accounting bases, therefore no comparative bar lengths -->
  <rect x="239" y="835" width="255" height="54" rx="9" fill="#FFF7F3" stroke="#D97757" stroke-width="2"/>
  <text x="258" y="857" class="small">DeepSeek API estimate</text><text x="258" y="880" class="body">$0.157</text>
  <rect x="514" y="835" width="333" height="54" rx="9" fill="#F2F7FD" stroke="#3373B9" stroke-width="2"/>
  <text x="533" y="857" class="small">Codex Plus token allocation</text><text x="533" y="880" class="body">$5 × 443,501 / Q_week ($3.314 API-equivalent)</text>
  <rect x="882" y="641" width="18" height="18" rx="3" fill="#D97757"/><text x="910" y="656" class="small">DeepSeek</text>
  <rect x="882" y="672" width="18" height="18" rx="3" fill="#3373B9"/><text x="910" y="687" class="small">GPT</text>

  <!-- Panel D -->
  <rect x="1044" y="552" width="494" height="365" rx="16" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1.5"/>
  <text x="1070" y="586" class="panel">(d) Editable delivery</text>
  <text x="1070" y="611" class="small">Successful artifacts over 20 tasks</text>
  <circle cx="1146" cy="704" r="59" fill="#E8F7F1" stroke="#009E73" stroke-width="12"/>
  <text x="1146" y="699" text-anchor="middle" class="value" fill="#007A5A">20/20</text>
  <text x="1146" y="725" text-anchor="middle" class="small">SVG</text>
  <circle cx="1335" cy="704" r="59" fill="#E8F7F1" stroke="#009E73" stroke-width="12"/>
  <text x="1335" y="699" text-anchor="middle" class="value" fill="#007A5A">20/20</text>
  <text x="1335" y="725" text-anchor="middle" class="small">PPTX</text>
  <text x="1070" y="804" class="body">Both backends achieved:</text>
  <text x="1070" y="833" class="body">• 100% editable SVG delivery</text>
  <text x="1070" y="861" class="body">• 100% native-object PPTX delivery</text>
  <text x="1070" y="893" class="small">PNG previews are rendered outputs, not the editable source.</text>

  <!-- Footer definitions -->
  <rect x="62" y="941" width="1476" height="91" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="88" y="972" class="panel">What the method labels mean</text>
  <text x="88" y="999" class="body">Pure-SVG benchmark: each text model writes structured SVG/scene code; GPT Image 2 is not used.</text>
  <text x="88" y="1023" class="body">Plus allocation: $5 weekly pool × artifact tokens / Q_week; $3.314 is retained only as the former API-equivalent estimate.</text>
  <text x="62" y="1061" class="tiny">Source: evaluation/visual-comparison.csv and evaluation/efficiency-cost.csv. Quality judge: GPT-5.6-Terra. “Consumed tokens” denotes recorded input plus output usage.</text>
</svg>
